name: Build Storm APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Build
        run: gradle assembleDebug --no-daemon -Pvc=${{ github.run_number }} -Pvn=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
      - run: cp app/build/outputs/apk/debug/app-debug.apk Storm.apk
      - uses: actions/upload-artifact@v4
        with: { name: Storm-apk, path: Storm.apk }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: Storm.apk }
