plugins { id 'com.android.application' }
android {
    namespace 'com.storm.browser'
    compileSdk 34
    defaultConfig {
        applicationId "com.storm.browser"
        minSdk 24
        targetSdk 34
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        versionCode = ((findProperty('vc') ?: '1') as String) as int
        versionName = ((findProperty('vn') ?: 'dev') as String).replaceFirst('^v', '')
    }
    // One fixed signing key for every build, so new versions can update the installed app in place.
    signingConfigs {
        storm {
            storeFile file('storm.keystore')
            storePassword 'stormstorm'
            keyAlias 'storm'
            keyPassword 'stormstorm'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.storm }
        release { minifyEnabled false; signingConfig signingConfigs.storm }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.wireguard.android:tunnel:1.0.20230706'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
